spring.application.name=medistock-backend

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medistock_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nanthidha@1452006}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# JWT Configuration
# Note: In production, the secret should be securely injected via environment variables.
medistock.app.jwtSecret=${MEDISTOCK_APP_JWTSECRET:MedistockSecretKeyForJwtAuthenticationWhichShouldBeVeryLongToBeSecureEnough1234567890}
medistock.app.jwtExpirationMs=86400000

# Server Configuration (Binds dynamically to Render's PORT variable)
server.port=${PORT:8081}