name: MediStock Pro CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-build:
    name: Backend CI (Spring Boot 3 + Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        run: |
          cd backend
          mvn clean test --batch-mode

      - name: Package Backend Application
        run: |
          cd backend
          mvn package -DskipTests --batch-mode

  frontend-test-and-build:
    name: Frontend CI (React 18 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Build Frontend Distribution
        run: |
          cd frontend
          npm run build
