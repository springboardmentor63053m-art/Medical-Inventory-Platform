name: CI

# Runs on every push/PR against main. Two independent jobs (backend,
# frontend) so a failure in one doesn't hide the other's result. Neither
# job needs a real database or any external credentials (Google OAuth2,
# email, SMS, FCM) — backend tests are unit tests against mocked
# repositories (see backend/src/test), not integration tests against a
# live MySQL/Postgres instance, so nothing here requires secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Backend dependency install
        run: mvn -B -ntp dependency:go-offline

      - name: Backend tests
        run: mvn -B -ntp test

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Backend build
        run: mvn -B -ntp clean package -DskipTests

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: medistock-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend:
    name: Frontend (Node / npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend npm install
        run: npm ci

      - name: Frontend tests
        run: npm run test

      - name: Frontend build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: medistock-frontend-dist
          path: frontend/dist/
          retention-days: 7
