spring:
  application:
    name: medistock

  datasource:
    url: jdbc:h2:mem:medistock;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
      continue-on-error: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: MediStockSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256AlgorithmSecurity
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  issuer: medistock
  audience: medistock-users

app:
  security:
    cors:
      allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: "*"
      exposed-headers: Authorization
      allow-credentials: true
      max-age: 3600

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
