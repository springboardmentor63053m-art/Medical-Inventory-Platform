spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medistock_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.medistock: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG