# ===============================
# MediStock Backend Configuration
# ===============================
spring.application.name=medistock-backend
server.port=${PORT:8080}

# ---- MySQL (Aiven Cloud) ----
spring.datasource.url=jdbc:mysql://localhost:3306/medistock_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Logging ----
logging.level.org.springframework.security=INFO
logging.level.com.medistock=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF

# ---- Frontend URL (used to redirect back after OAuth2 login) ----
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---- OAuth2 Google login (tech stack: "OAuth2 (Google Login)") ----
# Uncomment and set real values (or set as environment variables) to activate.
# Get credentials from https://console.cloud.google.com/apis/credentials —
# authorized redirect URI: http://localhost:8080/login/oauth2/code/google
# Until these two properties exist, Spring never creates a ClientRegistration
# bean, so SecurityConfig automatically skips oauth2Login() and nothing else
# in the app is affected.
# IMPORTANT: these lines must stay commented (leading '#') until you have
# real values. A property that resolves to a blank client-id/secret still
# makes Spring try to build a ClientRegistration and fails at startup —
# an empty ${VAR:} default here is NOT safe, unlike the notification flags below.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# ---- Email notifications (JavaMailSender) ----
# Email is disabled by default. Credentials are only required when
# EMAIL_ALERTS_ENABLED=true is explicitly configured.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.notifications.email.enabled=${EMAIL_ALERTS_ENABLED:false}
app.notifications.email.recipients=${EMAIL_ALERTS_RECIPIENTS:}

# ---- SMS notifications (tech stack: Twilio, called via plain REST — no SDK) ----
# twilio.account-sid=${TWILIO_ACCOUNT_SID}
# twilio.auth-token=${TWILIO_AUTH_TOKEN}
# twilio.from-number=${TWILIO_FROM_NUMBER}
app.notifications.sms.enabled=${SMS_ALERTS_ENABLED:false}

# ---- Push notifications (tech stack: Firebase Cloud Messaging, called via plain REST) ----
# firebase.project-id=${FIREBASE_PROJECT_ID}
# firebase.access-token=${FIREBASE_ACCESS_TOKEN}
app.notifications.push.enabled=${PUSH_ALERTS_ENABLED:false}

# ---- Demo data (bulk fallback medicines + synthetic purchase/sales history) ----
# The bootstrap Admin and the stock-movement audit backfill always run —
# they're correctness, not "flavor". This flag only gates the synthetic
# demo catalog/purchases/sales DataInitializer seeds into an empty database.
# Defaults on here for local/dev/docker-compose convenience;
# application-prod.properties turns it off so a real deployment never gets
# silently populated with demo suppliers/medicines/purchases/sales just
# because its database happened to start empty.
app.demo-data.enabled=false