spring.application.name=medistock-backend
server.port=8080

# ---- MySQL (Local Development) ----
spring.datasource.url=jdbc:mysql://localhost:3306/medistock_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Tisha#55
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
jwt.secret=medistockSecretKeyForJWTSigningChangeThisInProductionEnvironment123456
jwt.expiration-ms=86400000

# ---- Logging ----
logging.level.org.springframework.security=INFO
logging.level.com.medistock=DEBUG
