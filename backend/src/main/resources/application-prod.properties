# ===================================================
# Production profile - MySQL / Aiven Cloud
# ===================================================

spring.datasource.url=${DB_URL:jdbc:mysql://medistock-mysql-medistock-01.k.aivencloud.com:18982/defaultdb?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# No fallback value here on purpose: if JWT_SECRET isn't set, startup fails
# with a clear "Could not resolve placeholder 'JWT_SECRET'" error.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Optional: comma-separated frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Google login is explicitly configured through environment variables
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

app.notifications.email.enabled=${EMAIL_ALERTS_ENABLED:false}
app.notifications.email.recipients=${EMAIL_ALERTS_RECIPIENTS:}
app.notifications.sms.enabled=${SMS_ALERTS_ENABLED:false}
app.notifications.push.enabled=${PUSH_ALERTS_ENABLED:false}

logging.level.com.medistock=INFO

# Demo data OFF by default in production
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}