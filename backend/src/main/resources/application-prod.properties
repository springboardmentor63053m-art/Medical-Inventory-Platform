# ===================================================
# Production profile - PostgreSQL (activate with:
# --spring.profiles.active=prod, and set env vars)
# ===================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medistock_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:medistockSecretKeyForJWTSigningChangeThisInProductionEnvironment123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.com.medistock=INFO
