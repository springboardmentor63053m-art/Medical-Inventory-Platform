# ===================================================
# Production profile - PostgreSQL (activate with:
# --spring.profiles.active=prod, and set env vars)
# ===================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medistock_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# No fallback value here on purpose: if JWT_SECRET isn't set, startup fails
# with a clear "Could not resolve placeholder 'JWT_SECRET'" error rather than
# silently signing tokens with the well-known default from application.properties
# (which is committed to the repo, so it can't ever be a safe production secret).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Optional: set if you need MORE than one allowed frontend origin (comma-separated) —
# e.g. a Render static site URL AND a custom domain. Falls back to app.frontend-url above
# when unset. Either way, this is what SecurityConfig's CORS policy actually reads.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# To enable Google login in production, uncomment these three lines AND set
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET, then redeploy. Do not add a ":"
# default (e.g. ${GOOGLE_CLIENT_ID:}) to make this "always on" — Spring will
# still try to build a ClientRegistration from a blank client-id/secret and
# fail to start, so this must stay an explicit opt-in via the source file.
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# spring.security.oauth2.client.registration.google.scope=email,profile

app.notifications.email.enabled=${EMAIL_ALERTS_ENABLED:false}
app.notifications.email.recipients=${EMAIL_ALERTS_RECIPIENTS:}
app.notifications.sms.enabled=${SMS_ALERTS_ENABLED:false}
app.notifications.push.enabled=${PUSH_ALERTS_ENABLED:false}

logging.level.com.medistock=INFO

# Demo data OFF by default in prod — a real deployment must not get silently
# populated with demo suppliers/medicines/purchases/sales just because its
# database happened to start empty. Only the bootstrap Admin and the
# stock-movement audit backfill run regardless (see application.properties).
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
