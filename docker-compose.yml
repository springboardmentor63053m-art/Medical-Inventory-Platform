version: '3.8'

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: medistock-postgres
    restart: always
    environment:
      POSTGRES_DB: medistock_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medistock-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_URL=jdbc:postgresql://postgresdb:5432/medistock_db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres_password
    depends_on:
      - postgresdb

volumes:
  postgres_data:
